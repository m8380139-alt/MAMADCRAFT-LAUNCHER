name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Remove x86 Java runtimes (emulator only, saves size)
        run: |
          rm -f app_pojavlauncher/src/main/assets/components/jre/bin-x86.tar.xz app_pojavlauncher/src/main/assets/components/jre/bin-x86_64.tar.xz
          ls -la app_pojavlauncher/src/main/assets/components/jre

      # - name: Get JRE17
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-new
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk (32-bit and 64-bit)
        run: |
          gradle :app_pojavlauncher:assembleDebug
          ls -la app_pojavlauncher/build/outputs/apk/debug/
          for f in app_pojavlauncher/build/outputs/apk/debug/*.apk; do
            case "$f" in
              *armeabi-v7a*) cp "$f" out/MamadCraft-32bit-armeabi-v7a.apk ;;
              *arm64-v8a*)   cp "$f" out/MamadCraft-64bit-arm64-v8a.apk ;;
            esac
          done
          ls -la out/

      - name: Gen md5sums
        run: |
          cd out && md5sum *.apk > MamadCraft.md5

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MamadCraft-APKs (recommended)
          path: out/*

      # Release build needs the original author's signing key password; skipped when the secret is not set.
      - name: Build Release .apk
        if: env.GPLAY_KEYSTORE_PASSWORD != ''
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mkdir -p out-release
          cp app_pojavlauncher/build/outputs/apk/release/*.apk out-release/

      - name: Upload release APKs
        if: env.GPLAY_KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out-release/*
