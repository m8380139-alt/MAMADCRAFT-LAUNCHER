name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Remove x86 Java runtimes (emulator only, saves size)
        run: |
          rm -f app_pojavlauncher/src/main/assets/components/jre/bin-x86.tar.xz app_pojavlauncher/src/main/assets/components/jre/bin-x86_64.tar.xz
          ls -la app_pojavlauncher/src/main/assets/components/jre

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          set -euo pipefail
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk (32-bit and 64-bit)
        shell: bash
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleDebug

          apk_dir="app_pojavlauncher/build/outputs/apk/debug"
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print)
          if (("${#apks[@]}" == 0)); then
            echo "No debug APKs were generated in $apk_dir" >&2
            exit 1
          fi

          found32=0
          found64=0
          for apk in "${apks[@]}"; do
            case "$apk" in
              *armeabi-v7a*)
                if ((found32)); then
                  echo "More than one 32-bit APK was generated" >&2
                  exit 1
                fi
                cp "$apk" out/MamadCraft-32bit-armeabi-v7a.apk
                found32=1
                ;;
              *arm64-v8a*)
                if ((found64)); then
                  echo "More than one 64-bit APK was generated" >&2
                  exit 1
                fi
                cp "$apk" out/MamadCraft-64bit-arm64-v8a.apk
                found64=1
                ;;
            esac
          done

          if ((!found32 || !found64)); then
            echo "Expected one APK for each supported ABI (armeabi-v7a and arm64-v8a)." >&2
            printf 'Generated files:\n%s\n' "${apks[@]}" >&2
            exit 1
          fi

          ls -lh out/

      - name: Gen md5sums
        run: |
          set -euo pipefail
          cd out
          md5sum MamadCraft-32bit-armeabi-v7a.apk MamadCraft-64bit-arm64-v8a.apk > MamadCraft.md5

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MamadCraft-APKs (recommended)
          path: out/*

      # Release build needs the original author's signing key password; skipped when the secret is not set.
      - name: Build Release .apk
        if: env.GPLAY_KEYSTORE_PASSWORD != ''
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleRelease
          mkdir -p out-release
          cp app_pojavlauncher/build/outputs/apk/release/*.apk out-release/

      - name: Upload release APKs
        if: env.GPLAY_KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out-release/*
